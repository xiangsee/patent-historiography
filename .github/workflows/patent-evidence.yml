name: Patent Evidence Workbench QA

on:
  push:
    paths:
      - 'patent_evidence/**'
      - 'tests/test_patent_evidence.py'
      - 'scripts/validate_google*.py'
      - 'data/examples/**'
      - '.github/workflows/patent-evidence.yml'
  pull_request:
    paths:
      - 'patent_evidence/**'
      - 'tests/test_patent_evidence.py'
      - 'scripts/validate_google*.py'
      - 'data/examples/**'
      - '.github/workflows/patent-evidence.yml'

jobs:
  synthetic-and-public-derived-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reusable patent evidence unit tests
        run: python3 -m unittest discover -s tests -p 'test_patent_evidence.py' -v
      - name: Google 2000-2004 derived QA
        run: python3 scripts/validate_google_inc_2000_2004_global.py
      - name: Google 2000-2005 cross-window QA
        run: python3 scripts/validate_google_2000_2005_joint.py
      - name: Prior Shiji chronology QA
        run: python3 scripts/check_chronology_examples.py
      - name: Prior Google Overture claims QA
        run: python3 scripts/verify_adwords_case.py
