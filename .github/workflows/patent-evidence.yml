name: Patent Evidence Workbench QA

on:
  push:
    paths:
      - 'patent_evidence/**'
      - 'tests/test_patent_*.py'
      - 'scripts/validate_google*.py'
      - 'scripts/validate_document_versions_*.py'
      - 'scripts/validate_official_xml_*.py'
      - 'scripts/validate_ep_procedural_ledger_v06.py'
      - 'requirements-document-parser.txt'
      - 'data/examples/**'
      - '.github/workflows/patent-evidence.yml'
  pull_request:
    paths:
      - 'patent_evidence/**'
      - 'tests/test_patent_*.py'
      - 'scripts/validate_google*.py'
      - 'data/examples/**'
      - '.github/workflows/patent-evidence.yml'

permissions:
  contents: read

jobs:
  patent-evidence-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install optional patent HTML adapter dependency
        run: python3 -m pip install -r requirements-document-parser.txt
      - name: All evidence workbench unit tests
        run: python3 -m unittest discover -s tests -p 'test_patent_*.py' -v
      - name: Historical Maps fixture / double time audit
        run: |
          python3 -m patent_evidence.cli history-check \
            --input data/examples/maps-priority-rights-v0-2.json \
            --patent-id US20050270311A1 \
            --as-of 2005-02-08 \
            --output /tmp/google-maps-historical-snapshot.json
      - name: Tencent/Huawei field coverage quality
        run: |
          python3 -m patent_evidence.cli text-check \
            --input data/examples/cn2002-text-availability-v0-3.json \
            --output /tmp/cn2002-text-qa.json
          python3 scripts/validate_cross_company_2026_11_20.py
      - name: EP procedural role and Claim Lifecycle QA
        run: python3 scripts/validate_ep_procedural_ledger_v06.py
      - name: Official EPO/WIPO XML derived-data regression
        run: python3 scripts/validate_official_xml_2026_11_20.py
      - name: Six-publication version structural regression
        run: python3 scripts/validate_document_versions_2026_11_20.py
      - name: Google 2000-2004 public derived data regression
        run: python3 scripts/validate_google_inc_2000_2004_global.py
      - name: Google 2000-2005 family-overlap regression
        run: python3 scripts/validate_google_2000_2005_joint.py
      - name: Shiji chronology fixture
        run: python3 scripts/check_chronology_examples.py
      - name: Google-Overture claim fixture
        run: python3 scripts/verify_adwords_case.py
